<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroBase — Busca Agrícola</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #2d5a27;
    --verde-medio: #4a8c3f;
    --verde-claro: #7dbf6e;
    --creme: #f7f3ec;
    --terra: #8b5e3c;
    --texto: #1a1a1a;
    --texto-sec: #555;
    --borda: #d8e8d4;
    --card-bg: #ffffff;
    --sombra: 0 4px 24px rgba(45,90,39,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--creme);
    color: var(--texto);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background decorativo */
  body::before {
    content: '';
    position: fixed;
    top: -120px; right: -120px;
    width: 480px; height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(125,191,110,0.18) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; left: -100px;
    width: 360px; height: 360px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(45,90,39,0.10) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── TELA INICIAL ── */
  #home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    position: relative;
    z-index: 1;
    transition: all 0.4s ease;
  }

  .logo-area {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeDown 0.7s ease both;
  }

  .logo-leaf {
    font-size: 3.5rem;
    line-height: 1;
    margin-bottom: 0.5rem;
    display: block;
    filter: drop-shadow(0 2px 8px rgba(45,90,39,0.3));
  }

  .logo-title {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    font-weight: 700;
    color: var(--verde);
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .logo-title span {
    color: var(--verde-claro);
  }

  .logo-sub {
    font-size: 0.95rem;
    color: var(--texto-sec);
    margin-top: 0.5rem;
    font-weight: 300;
    letter-spacing: 0.03em;
  }

  /* ── BARRA DE BUSCA ── */
  .search-wrap {
    width: 100%;
    max-width: 620px;
    position: relative;
    animation: fadeUp 0.7s 0.15s ease both;
  }

  .search-box {
    width: 100%;
    padding: 1rem 3.5rem 1rem 1.4rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.05rem;
    font-weight: 400;
    border: 2px solid var(--borda);
    border-radius: 50px;
    background: #fff;
    outline: none;
    color: var(--texto);
    box-shadow: var(--sombra);
    transition: border 0.2s, box-shadow 0.2s;
  }

  .search-box:focus {
    border-color: var(--verde-claro);
    box-shadow: 0 4px 32px rgba(74,140,63,0.18);
  }

  .search-box::placeholder { color: #aaa; }

  .search-btn {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    background: var(--verde);
    border: none;
    border-radius: 50%;
    width: 40px; height: 40px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.15s;
  }

  .search-btn:hover { background: var(--verde-medio); transform: translateY(-50%) scale(1.07); }

  .search-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; }

  /* Sugestões rápidas */
  .quick-tags {
    margin-top: 1.2rem;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    animation: fadeUp 0.7s 0.3s ease both;
  }

  .tag {
    background: #fff;
    border: 1.5px solid var(--borda);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.82rem;
    color: var(--verde-medio);
    cursor: pointer;
    transition: all 0.18s;
    font-weight: 500;
  }

  .tag:hover {
    background: var(--verde);
    color: #fff;
    border-color: var(--verde);
  }

  /* ── AUTOCOMPLETE ── */
  #autocomplete {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: #fff;
    border: 1.5px solid var(--borda);
    border-radius: 16px;
    box-shadow: var(--sombra);
    overflow: hidden;
    z-index: 100;
    display: none;
  }

  .auto-item {
    padding: 10px 18px;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s;
  }

  .auto-item:hover, .auto-item.active { background: var(--creme); }
  .auto-icon { font-size: 1rem; }

  /* ── TELA DE RESULTADOS ── */
  #results-page {
    display: none;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }

  .results-header {
    background: var(--verde);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .header-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }

  .header-logo span { color: var(--verde-claro); }

  .search-wrap-sm {
    flex: 1;
    max-width: 560px;
    position: relative;
  }

  .search-box-sm {
    width: 100%;
    padding: 0.65rem 3rem 0.65rem 1.2rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 40px;
    background: rgba(255,255,255,0.12);
    outline: none;
    color: #fff;
    transition: border 0.2s;
  }

  .search-box-sm:focus { border-color: var(--verde-claro); background: rgba(255,255,255,0.18); }
  .search-box-sm::placeholder { color: rgba(255,255,255,0.5); }

  .search-btn-sm {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    background: var(--verde-claro);
    border: none; border-radius: 50%;
    width: 32px; height: 32px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }

  .search-btn-sm:hover { background: #8fd17d; }
  .search-btn-sm svg { width: 15px; height: 15px; stroke: var(--verde); fill: none; stroke-width: 2.5; stroke-linecap: round; }

  /* Conteúdo de resultados */
  .results-body {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .results-meta {
    font-size: 0.82rem;
    color: var(--texto-sec);
    margin-bottom: 1.5rem;
  }

  .results-meta strong { color: var(--verde); }

  /* Card de resultado */
  .result-card {
    background: var(--card-bg);
    border: 1.5px solid var(--borda);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.2rem;
    transition: box-shadow 0.2s, transform 0.2s;
    animation: slideIn 0.35s ease both;
    cursor: pointer;
  }

  .result-card:hover {
    box-shadow: 0 8px 32px rgba(45,90,39,0.13);
    transform: translateY(-2px);
  }

  .card-category {
    display: inline-block;
    background: rgba(74,140,63,0.10);
    color: var(--verde-medio);
    font-size: 0.72rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 0.6rem;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--verde);
    margin-bottom: 0.5rem;
  }

  .card-body {
    font-size: 0.92rem;
    color: var(--texto-sec);
    line-height: 1.7;
  }

  .card-body p { margin-bottom: 0.4rem; }
  .card-body strong { color: var(--texto); font-weight: 500; }

  .card-tags {
    margin-top: 0.8rem;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .card-tag {
    background: var(--creme);
    border: 1px solid var(--borda);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 0.75rem;
    color: var(--texto-sec);
  }

  /* Nenhum resultado */
  .no-result {
    text-align: center;
    padding: 3rem 1rem;
    animation: fadeUp 0.5s ease;
  }

  .no-result .emoji { font-size: 3rem; margin-bottom: 1rem; }
  .no-result h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--verde); margin-bottom: 0.5rem; }
  .no-result p { color: var(--texto-sec); font-size: 0.92rem; }

  /* Detalhes do card */
  #detail-page {
    display: none;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }

  .detail-body {
    max-width: 760px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--verde-medio);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    padding: 0;
    margin-bottom: 1.5rem;
    transition: color 0.18s;
  }

  .back-btn:hover { color: var(--verde); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }

  .detail-card {
    background: var(--card-bg);
    border: 1.5px solid var(--borda);
    border-radius: 20px;
    padding: 2rem 2.2rem;
    box-shadow: var(--sombra);
  }

  .detail-category {
    display: inline-block;
    background: rgba(74,140,63,0.10);
    color: var(--verde-medio);
    font-size: 0.75rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 0.8rem;
  }

  .detail-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--verde);
    margin-bottom: 1.2rem;
    line-height: 1.2;
  }

  .detail-section { margin-bottom: 1.4rem; }
  .detail-section h4 {
    font-size: 0.8rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--verde-medio);
    margin-bottom: 0.5rem;
  }

  .detail-section p, .detail-section li {
    font-size: 0.95rem;
    color: var(--texto-sec);
    line-height: 1.75;
  }

  .detail-section ul { padding-left: 1.3rem; }
  .detail-section li { margin-bottom: 0.3rem; }

  .detail-tags {
    margin-top: 1.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--borda);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .detail-tag {
    background: var(--creme);
    border: 1px solid var(--borda);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.8rem;
    color: var(--texto-sec);
  }

  /* Animações */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsivo */
  @media (max-width: 600px) {
    .logo-title { font-size: 2.2rem; }
    .results-header { gap: 1rem; }
    .header-logo { font-size: 1.2rem; }
    .detail-title { font-size: 1.5rem; }
    .detail-card { padding: 1.4rem; }
  }
</style>
</head>
<body>

<!-- ═══════════════ TELA INICIAL ═══════════════ -->
<div id="home">
  <div class="logo-area">
    <span class="logo-leaf">🌿</span>
    <div class="logo-title">Agro<span>Base</span></div>
    <div class="logo-sub">Enciclopédia agrícola brasileira</div>
  </div>

  <div class="search-wrap">
    <input
      type="text"
      id="main-input"
      class="search-box"
      placeholder="Pesquise uma cultura, praga, técnica..."
      autocomplete="off"
      oninput="onInput(this.value, 'main')"
      onkeydown="onKey(event, 'main')"
    />
    <button class="search-btn" onclick="doSearch(document.getElementById('main-input').value)" aria-label="Buscar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <div id="autocomplete" role="listbox"></div>
  </div>

  <div class="quick-tags" id="tags">
    <!-- preenchidas pelo JS -->
  </div>
</div>

<!-- ═══════════════ RESULTADOS ═══════════════ -->
<div id="results-page">
  <div class="results-header">
    <div class="header-logo" onclick="goHome()">Agro<span>Base</span></div>
    <div class="search-wrap-sm">
      <input
        type="text"
        id="results-input"
        class="search-box-sm"
        placeholder="Nova pesquisa..."
        autocomplete="off"
        oninput="onInput(this.value, 'results')"
        onkeydown="onKey(event, 'results')"
      />
      <button class="search-btn-sm" onclick="doSearch(document.getElementById('results-input').value)" aria-label="Buscar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
  </div>
  <div class="results-body">
    <div class="results-meta" id="results-meta"></div>
    <div id="results-list"></div>
  </div>
</div>

<!-- ═══════════════ DETALHE ═══════════════ -->
<div id="detail-page">
  <div class="results-header">
    <div class="header-logo" onclick="goHome()">Agro<span>Base</span></div>
    <div class="search-wrap-sm">
      <input
        type="text"
        id="detail-input"
        class="search-box-sm"
        placeholder="Nova pesquisa..."
        autocomplete="off"
        onkeydown="if(event.key==='Enter') doSearch(this.value)"
      />
      <button class="search-btn-sm" onclick="doSearch(document.getElementById('detail-input').value)" aria-label="Buscar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
  </div>
  <div class="detail-body">
    <button class="back-btn" onclick="goBack()" aria-label="Voltar">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Voltar aos resultados
    </button>
    <div id="detail-content"></div>
  </div>
</div>

let lastQuery = '';
let lastResults = [];
let activeAutocomplete = -1;
let acItems = [];

// ════════════════════════════════════════════
//  INICIALIZAÇÃO
// ════════════════════════════════════════════
function init() {
  // preenche tags rápidas com categorias
  const cats = [...new Set(DB.map(d => d.categoria))];
  const tagContainer = document.getElementById('tags');
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tag';
    btn.textContent = cat;
    btn.onclick = () => doSearch(cat);
    tagContainer.appendChild(btn);
  });

  // sugestões populares
  const popular = ['Soja','Milho','Irrigação','Plantio Direto','Orgânico','Ferrugem'];
  popular.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'tag';
    btn.textContent = p;
    btn.onclick = () => doSearch(p);
    tagContainer.appendChild(btn);
  });
}

// ════════════════════════════════════════════
//  BUSCA PRINCIPAL
// ════════════════════════════════════════════
function doSearch(query) {
  query = (query || '').trim();
  if (!query) return;

  lastQuery = query;
  hideAutocomplete();

  const q = normalize(query);
  const results = DB.filter(item => matches(item, q));
  lastResults = results;

  showResultsPage(query, results);
}

function matches(item, q) {
  const words = q.split(/\s+/);
  const haystack = [
    item.titulo, item.categoria, item.resumo, item.descricao,
    ...item.tags, ...item.palavras,
    ...Object.values(item.detalhes),
    ...(item.lista || [])
  ].join(' ').toLowerCase();

  return words.every(w => haystack.includes(w));
}

function normalize(str) {
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s]/g, '');
}

// ════════════════════════════════════════════
//  AUTOCOMPLETE
// ════════════════════════════════════════════
function onInput(val, source) {
  if (!val.trim()) { hideAutocomplete(); return; }
  const q = normalize(val);
  const suggestions = DB.filter(item => matches(item, q)).slice(0, 5);
  acItems = suggestions;
  activeAutocomplete = -1;

  const box = document.getElementById('autocomplete');
  if (!suggestions.length) { hideAutocomplete(); return; }

  box.innerHTML = '';
  suggestions.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'auto-item';
    div.setAttribute('role', 'option');
    div.innerHTML = `<span class="auto-icon">${catIcon(item.categoria)}</span>${item.titulo}`;
    div.onclick = () => {
      hideAutocomplete();
      openDetail(item.id);
    };
    box.appendChild(div);
  });

  box.style.display = 'block';
}

function onKey(e, source) {
  const box = document.getElementById('autocomplete');
  const items = box.querySelectorAll('.auto-item');

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeAutocomplete = Math.min(activeAutocomplete + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === activeAutocomplete));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeAutocomplete = Math.max(activeAutocomplete - 1, -1);
    items.forEach((el, i) => el.classList.toggle('active', i === activeAutocomplete));
  } else if (e.key === 'Enter') {
    if (activeAutocomplete >= 0 && acItems[activeAutocomplete]) {
      hideAutocomplete();
      openDetail(acItems[activeAutocomplete].id);
    } else {
      const inputId = source === 'main' ? 'main-input' : 'results-input';
      doSearch(document.getElementById(inputId).value);
    }
  } else if (e.key === 'Escape') {
    hideAutocomplete();
  }
}

function hideAutocomplete() {
  document.getElementById('autocomplete').style.display = 'none';
  activeAutocomplete = -1;
}

function catIcon(cat) {
  const map = { 'Cultura': '🌾', 'Praga': '🐛', 'Técnica': '⚙️', 'Solo e Nutrição': '🪨', 'Irrigação': '💧', 'Agropecuária': '🐄', 'Agroecologia': '🌿' };
  return map[cat] || '📋';
}

// ════════════════════════════════════════════
//  RENDERIZAR RESULTADOS
// ════════════════════════════════════════════
function showResultsPage(query, results) {
  document.getElementById('home').style.display = 'none';
  document.getElementById('detail-page').style.display = 'none';
  document.getElementById('results-page').style.display = 'block';
  document.getElementById('results-input').value = query;

  const meta = document.getElementById('results-meta');
  meta.innerHTML = results.length
    ? `${results.length} resultado${results.length > 1 ? 's' : ''} para <strong>"${escHtml(query)}"</strong>`
    : '';

  const list = document.getElementById('results-list');
  list.innerHTML = '';

  if (!results.length) {
    list.innerHTML = `
      <div class="no-result">
        <div class="emoji">🌱</div>
        <h3>Nenhum resultado encontrado</h3>
        <p>Tente termos como: soja, irrigação, ferrugem, plantio direto, calagem...</p>
      </div>`;
    return;
  }

  results.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'result-card';
    card.style.animationDelay = `${idx * 0.05}s`;
    card.innerHTML = `
      <span class="card-category">${catIcon(item.categoria)} ${item.categoria}</span>
      <div class="card-title">${escHtml(item.titulo)}</div>
      <div class="card-body"><p>${escHtml(item.resumo)}</p></div>
      <div class="card-tags">${item.tags.map(t => `<span class="card-tag">${escHtml(t)}</span>`).join('')}</div>
    `;
    card.onclick = () => openDetail(item.id);
    list.appendChild(card);
  });

  window.scrollTo(0, 0);
}

// ════════════════════════════════════════════
//  DETALHE
// ════════════════════════════════════════════
function openDetail(id) {
  const item = DB.find(d => d.id === id);
  if (!item) return;

  document.getElementById('home').style.display = 'none';
  document.getElementById('results-page').style.display = 'none';
  document.getElementById('detail-page').style.display = 'block';
  document.getElementById('detail-input').value = lastQuery;

  const detailesHtml = Object.entries(item.detalhes).map(([k, v]) =>
    `<li><strong>${escHtml(k)}:</strong> ${escHtml(v)}</li>`
  ).join('');

  const listaHtml = item.lista.map(l => `<li>${escHtml(l)}</li>`).join('');

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-card">
      <span class="detail-category">${catIcon(item.categoria)} ${escHtml(item.categoria)}</span>
      <h1 class="detail-title">${escHtml(item.titulo)}</h1>
      <div class="detail-section">
        <h4>Visão Geral</h4>
        <p>${escHtml(item.descricao)}</p>
      </div>
      <div class="detail-section">
        <h4>Informações Técnicas</h4>
        <ul>${detailesHtml}</ul>
      </div>
      <div class="detail-section">
        <h4>Boas Práticas e Recomendações</h4>
        <ul>${listaHtml}</ul>
      </div>
      <div class="detail-tags">
        ${item.tags.map(t => `<span class="detail-tag">${escHtml(t)}</span>`).join('')}
      </div>
    </div>
  `;

  window.scrollTo(0, 0);
}

function goBack() {
  document.getElementById('detail-page').style.display = 'none';
  if (lastResults.length > 0) {
    showResultsPage(lastQuery, lastResults);
  } else {
    goHome();
  }
}

function goHome() {
  document.getElementById('results-page').style.display = 'none';
  document.getElementById('detail-page').style.display = 'none';
  document.getElementById('home').style.display = 'flex';
  document.getElementById('main-input').value = '';
  hideAutocomplete();
  window.scrollTo(0, 0);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Fechar autocomplete ao clicar fora
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap') && !e.target.closest('.search-wrap-sm')) {
    hideAutocomplete();
  }
});

init();
</script>
</body>
</html>
